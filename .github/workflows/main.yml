name: DevSecOps CI/CD

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  JAVA_VERSION: "25"
  DEPENDENCY_CHECK_VERSION: "12.2.2"
  DEPENDENCY_CHECK_DATA_DIR: ".dependency-check-data"

jobs:
  backend-quality:
    name: Backend Build, Test and Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Maven build and tests
        run: ./mvnw -B clean test

      - name: SpotBugs static analysis
        run: ./mvnw -B spotbugs:spotbugs spotbugs:check

      - name: JaCoCo coverage check
        run: ./mvnw -B verify

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn

      - name: Upload SpotBugs XML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-report
          path: backend/target/spotbugsXml.xml
          if-no-files-found: warn

      - name: Cache OWASP Dependency Check data
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_DIR }}
          key: dependency-check-data-${{ runner.os }}-${{ env.DEPENDENCY_CHECK_VERSION }}
          restore-keys: |
            dependency-check-data-${{ runner.os }}-

      - name: OWASP Dependency Check
        # Only runs on push to main/develop to keep PRs fast (~25 min NVD download).
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          NVD_ARGS=""
          if [ -n "$NVD_API_KEY" ]; then
            echo "Using NVD API key from GitHub Actions secrets."
            NVD_ARGS="-DnvdApiKey=$NVD_API_KEY"
          else
            echo "NVD_API_KEY secret is not configured. Dependency Check will run without an API key."
          fi

          ./mvnw -B org.owasp:dependency-check-maven:${DEPENDENCY_CHECK_VERSION}:check \
            -DdataDirectory=../${DEPENDENCY_CHECK_DATA_DIR} \
            -DfailBuildOnCVSS=7 \
            -DassemblyAnalyzerEnabled=false \
            -DnodeAnalyzerEnabled=false \
            -DnodeAuditAnalyzerEnabled=false \
            -DretireJsAnalyzerEnabled=false \
            $NVD_ARGS

      - name: Upload OWASP Dependency Check reports
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            backend/target/dependency-check-report.html
            backend/target/dependency-check-report.xml
            backend/target/dependency-check-report.sarif
          if-no-files-found: warn

      - name: Upload OWASP SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name == 'push' && hashFiles('backend/target/dependency-check-report.sarif') != ''
        with:
          sarif_file: backend/target/dependency-check-report.sarif

      - name: SonarCloud scan and Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_PROJECT_KEY" ] || [ -z "$SONAR_ORGANIZATION" ]; then
            echo "Missing SonarCloud configuration. Set SONAR_TOKEN secret plus SONAR_PROJECT_KEY and SONAR_ORGANIZATION repository variables."
            exit 1
          fi

          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

  frontend-quality:
    name: Frontend Build, Lint and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Unit tests with coverage
        run: npx vitest run --coverage

      - name: Production build
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
