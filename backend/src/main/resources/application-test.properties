# 1. Configuración de la base de datos en memoria (H2)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# 2. Desactivar Flyway en los tests
spring.flyway.enabled=false

# 3. Dejar que Hibernate cree y destruya las tablas solo para los tests
spring.jpa.hibernate.ddl-auto=create-drop
# Forzar el dialecto de H2 para evitar que Hibernate 7 se confunda con el MODE=PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 4. Desactivar Docker Compose durante la fase de testing
spring.docker.compose.skip.in-tests=true